  <script>
    // Pick the theme before first paint so there's no flash of the wrong one:
    // saved choice first, otherwise the OS preference.
    (function () {
      var theme;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", theme);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", theme === "light" ? "#f6f3ee" : "#121110");
    })();
  </script>
  <style>
    /* Paint the right background before any CSS/JS arrives. */
    html, body { background: #f6f3ee; }
    html[data-theme="dark"], html[data-theme="dark"] body { background: #121110; }
  </style>
